<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Daftar — Project 01 Roby Ramjako</title>
  <meta name="description" content="Halaman daftar akun demo kaca, dibuat dengan HTML, CSS, dan JavaScript murni.">
  <meta name="theme-color" content="#e9edf2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><circle cx='50' cy='38' r='16' fill='white'/><path d='M20 82c4-18 16-26 30-26s26 8 30 26' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-decor" aria-hidden="true"></div>

  <div class="login-wrap">
    <a class="brand-mini" href="../../projects.html">Roby<span>+</span></a>

  <main class="card" id="card">
    <h1>Daftar</h1>
    <p class="sub">Isi data di bawah. Tidak ada yang disimpan.</p>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="name">Nama</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Nama kamu"
            autocomplete="name"
            autocapitalize="words"
            autocorrect="off"
            spellcheck="false"
            aria-describedby="nameError"
            aria-invalid="false"
          >
        </div>
        <p class="error" id="nameError" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="identity">Email atau username</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
          </span>
          <input
            type="text"
            id="identity"
            name="identity"
            placeholder="nama@email.com / username"
            autocomplete="username"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            aria-describedby="identityError"
            aria-invalid="false"
          >
        </div>
        <p class="error" id="identityError" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          </span>
          <input
            type="password"
            id="password"
            name="password"
            class="with-toggle"
            placeholder="Minimal 8 karakter, huruf + angka"
            autocomplete="new-password"
            aria-describedby="passwordError"
            aria-invalid="false"
          >
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Tampilkan password" aria-pressed="false">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
          </button>
        </div>
        <p class="error" id="passwordError" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="confirm">Ulangi password</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          </span>
          <input
            type="password"
            id="confirm"
            name="confirm"
            placeholder="Ketik ulang password"
            autocomplete="new-password"
            aria-describedby="confirmError"
            aria-invalid="false"
          >
        </div>
        <p class="error" id="confirmError" aria-live="polite"></p>
      </div>

      <button type="submit" class="btn" id="submitBtn" disabled>
        <span class="btn-text">Daftar</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </form>

    <div id="doneState" hidden>
      <p class="notice">Akun demo berhasil dibuat (simulasi — tidak ada yang disimpan).</p>
      <a href="index.html" class="btn-secondary">Kembali masuk</a>
    </div>

    <p class="auth-switch" id="backLink">Sudah punya akun? <a href="index.html" class="text-link">Masuk</a></p>
    <p class="demo-note">Demo frontend murni: tanpa hash password, jangan pakai data asli.</p>
  </main>
  </div>

  <script src="register.js"></script>
</body>
</html>
